<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 228" role="img" aria-label="A dead server's protected VMs restart on their copy in about 3 minutes" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .ink { fill: #1d2430; } .quiet { fill: #5b6574; } .edge { stroke: #9aa3ae; } .box { fill: none; stroke: #9aa3ae; stroke-width: 1.25; }
    .main { fill: #014578; fill-opacity: .12; stroke: #014578; stroke-width: 2; } .arrow { fill: #9aa3ae; }
    @media (prefers-color-scheme: dark) { .ink { fill: #e6e9ee; } .quiet { fill: #a7b0bc; } .main { fill: #4a9fe0; stroke: #4a9fe0; } }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrow" d="M0 0L10 5L0 10z"/></marker></defs>
  <text class="ink" x="24" y="34" font-size="15" font-weight="600">A dead server's protected VMs restart on their copy in about 3 minutes</text>
  <g class="edge" fill="none" stroke-width="1.25">
    <path d="M184 108H208" marker-end="url(#a)"/><path d="M368 108H392" marker-end="url(#a)"/><path d="M552 108H576" marker-end="url(#a)"/>
    <path d="M656 152V184H104V152" marker-end="url(#a)"/>
  </g>
  <rect class="box" x="24" y="64" width="160" height="88" rx="8"/>
  <text class="ink" x="36" y="88" font-weight="600">Normal running</text>
  <text class="quiet" x="36" y="108" font-size="11.5">VM runs on server A</text>
  <text class="quiet" x="36" y="124" font-size="11.5">disk copied to B</text>
  <text class="quiet" x="36" y="140" font-size="11.5">every 15 minutes</text>
  <rect class="box" x="208" y="64" width="160" height="88" rx="8"/>
  <text class="ink" x="220" y="88" font-weight="600">Server A dies</text>
  <text class="quiet" x="220" y="108" font-size="11.5">no answer for 3 min</text>
  <text class="quiet" x="220" y="124" font-size="11.5">its tunnel is silent</text>
  <text class="quiet" x="220" y="140" font-size="11.5">too: really down</text>
  <rect class="main" x="392" y="64" width="160" height="88" rx="8"/>
  <text class="ink" x="404" y="88" font-weight="600">Failover</text>
  <text class="ink" x="404" y="108" font-size="11.5">master starts copy on B</text>
  <text class="ink" x="404" y="124" font-size="11.5">same name and MAC</text>
  <text class="ink" x="404" y="140" font-size="11.5">newest changes lost</text>
  <rect class="box" x="576" y="64" width="160" height="88" rx="8"/>
  <text class="ink" x="588" y="88" font-weight="600">A comes back</text>
  <text class="quiet" x="588" y="108" font-size="11.5">old VM switched off</text>
  <text class="quiet" x="588" y="124" font-size="11.5">it becomes the copy</text>
  <text class="quiet" x="588" y="140" font-size="11.5">copies run B to A</text>
  <text class="quiet" x="392" y="204" text-anchor="middle" font-size="11.5">back to normal with the roles swapped; on Ceph nothing is copied or lost</text>
</svg>
